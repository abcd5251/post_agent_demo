# Two Render cron jobs. Both wake up every 15 minutes (Render cron is UTC);
# main.py checks config.py (GENERATE_TIME / PUBLISH_TIME, Asia/Taipei) and the
# sheet's _state tab, so each job really runs once a day.
# Change the times in config.py, not here.
# (BUFFER_*_CHANNEL_ID are optional; leave them empty if you have one FB and one IG channel.)
services:
  - type: cron
    name: autopost-generate
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py generate
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BUFFER_API_KEY
        sync: false
      - key: BUFFER_FACEBOOK_CHANNEL_ID
        sync: false
      - key: BUFFER_INSTAGRAM_CHANNEL_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

  - type: cron
    name: autopost-publish
    runtime: python
    schedule: "*/15 * * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py publish
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_SHEET_ID
        sync: false
      - key: GOOGLE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: BUFFER_API_KEY
        sync: false
      - key: BUFFER_FACEBOOK_CHANNEL_ID
        sync: false
      - key: BUFFER_INSTAGRAM_CHANNEL_ID
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
